<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bank Payment Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Select Payment Method</h1>
        <p>Scan the relevant QR code using your preferred digital bank or e-wallet application.</p>
    </header>

    <div class="payment-list">
        
        <div class="payment-card bpi">
            <div class="card-border"></div>
            <div class="bank-logo">BPI</div>
            <div class="qr-container">
                <img class="qr-code" src="bpi-qr.jpg" alt="BPI QR Code">
            </div>
        </div>

        <div class="payment-card gcash">
            <div class="card-border"></div>
            <div class="bank-logo">GCash</div>
            <div class="qr-container">
                <img class="qr-code" src="gcash-qr.jpg" alt="GCash QR Code">
            </div>
        </div>

        <div class="payment-card maribank">
            <div class="card-border"></div>
            <div class="bank-logo">MariBank</div>
            <div class="qr-container">
                <img class="qr-code" src="maribank-qr.jpg" alt="MariBank QR Code">
            </div>
        </div>

    </div>
</div>

</body>
</html>
